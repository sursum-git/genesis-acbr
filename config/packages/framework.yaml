framework:
  secret: '%env(APP_SECRET)%'
  handle_all_throwables: true
  http_method_override: false
  serializer:
    enabled: true
  validation:
    enabled: true
  router:
    utf8: true
  session:
    enabled: true
    cookie_lifetime: 0
    gc_maxlifetime: 3600
    cookie_secure: auto
    cookie_samesite: lax

when@test:
  framework:
    test: true
    session:
      storage_factory_id: session.storage.factory.mock_file
