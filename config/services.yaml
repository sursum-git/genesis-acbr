imports:
  - { resource: services/consulta_cep.yaml }
  - { resource: services/doctrine_connection.xml }
  - { resource: services/audit_connection.xml }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'

  App\OpenApi\LegacyOptionalRequestBodyOpenApiFactory:
    decorates: 'api_platform.openapi.factory'
    arguments:
      $decorated: '@App\OpenApi\LegacyOptionalRequestBodyOpenApiFactory.inner'

  App\Repository\ApiAssinanteRepository:
    arguments:
      $auditConnection: '@app.audit_connection'

  App\Repository\ApiExecutionModeRepository:
    arguments:
      $auditConnection: '@app.audit_connection'

  App\Repository\ApiAuditRepository:
    arguments:
      $auditConnection: '@app.audit_connection'

  App\Repository\ApiAuditDashboardRepository:
    arguments:
      $auditConnection: '@app.audit_connection'

  App\Repository\ApiExtractionRepository:
    arguments:
      $auditConnection: '@app.audit_connection'

  App\Repository\ApiSuccessParameterRepository:
    arguments:
      $auditConnection: '@app.audit_connection'

  App\Repository\ExecutionConfigRepository:
    arguments:
      $auditConnection: '@app.audit_connection'

  App\Repository\WorkerCapacityRepository:
    arguments:
      $auditConnection: '@app.audit_connection'

  App\Repository\SubscriberAdminRepository:
    arguments:
      $auditConnection: '@app.audit_connection'

  App\Repository\WebhookRepository:
    arguments:
      $auditConnection: '@app.audit_connection'

  App\Repository\WorkerMonitorRepository:
    arguments:
      $auditConnection: '@app.audit_connection'

  App\Service\Api\ApiExecutionModeResolver:
    arguments:
      $defaultMode: '%env(string:API_EXECUTION_MODE_DEFAULT)%'

  App\Service\Api\InternalApiRequestRunner:
    arguments:
      $internalBaseUrl: '%env(string:APP_INTERNAL_BASE_URL)%'
